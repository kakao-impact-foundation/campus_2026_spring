<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>26-2학기 중간 아카이브 — 테크포임팩트 캠퍼스</title>
<meta name="description" content="테크포임팩트 캠퍼스 2026 가을학기 중간 워크시트 아카이브">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@font-face{font-family:"KakaoBigSans";src:url("assets/fonts/KakaoBigSans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"KakaoBigSans";src:url("assets/fonts/KakaoBigSans-Bold.woff2") format("woff2");font-weight:600 700;font-display:swap}
@font-face{font-family:"KakaoBigSans";src:url("assets/fonts/KakaoBigSans-ExtraBold.woff2") format("woff2");font-weight:800;font-display:swap}
:root{
  --font-display:"KakaoBigSans","Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --ink:#191919; --muted:#8c8c8c; --soft:#f4f4f2; --hair:#ececec; --ground:#fff;
  --accent:#fae100; --point:#e470dc;
  --foot:#272727; --foot-line:#404040; --foot-txt:#9c9c9c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,"Noto Sans KR",sans-serif;color:var(--ink);background:var(--ground);line-height:1.5;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}

/* header */
.hdr{position:sticky;top:0;z-index:50;border-bottom:1px solid #eee;background:rgba(255,255,255,.92);backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px)}
.hdr .wrap{height:80px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.hdr nav{display:flex;gap:36px;font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:.04em;color:#9a9a9a}
.hdr nav a:hover,.hdr nav a.on{color:var(--ink)}
.hdr nav a.on{border-bottom:2px solid var(--ink);padding-bottom:4px}
.brand-ki svg{height:19px!important}

/* list page */
.eyebrow{font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--muted);margin-top:56px}
h1.page{font-family:var(--font-display);font-size:36px;font-weight:800;letter-spacing:-.03em;margin-top:14px;line-height:1.08}
.lead{margin-top:16px;font-size:18px;color:#555}
.lead b{color:var(--ink)}

.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;margin-top:44px}
.side{font-family:var(--font-display)}
.side h4{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--muted);margin-bottom:10px}
.side ul{list-style:none}
.side li button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border:0;background:none;border-radius:10px;font-size:13.5px;color:#555;cursor:pointer;text-align:left}
.side li button span:last-child{color:var(--muted);font-size:12px;font-weight:600}
.side li button:hover{background:var(--soft)}
.side li button.on{background:var(--soft);color:var(--ink);font-weight:700}
.side li.kw{margin-top:10px}
.side li.kw button{font-weight:700;color:var(--ink);font-size:14.5px}
.side li.kw button .k{display:inline-flex;align-items:center;gap:8px}
.side li.org button{padding:6px 12px 6px 28px;font-size:13px;font-weight:400;color:#666}
.kdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.side .side-scroll{position:sticky;top:100px;max-height:calc(100vh - 120px);overflow:auto;padding-right:4px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--hair);background:#fff;border-radius:999px;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;color:#444}
.chip:hover{border-color:#ccc}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 14px}
.count{font-size:13px;color:var(--muted)}
.count b{color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:8px 14px;min-width:240px}
.search input{border:0;background:none;outline:none;font-size:13.5px;width:100%}
.search svg{flex:none;color:#999}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--soft);border-radius:18px;padding:22px 22px 18px;min-height:220px;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.08)}
.card .meta{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h3{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.3;margin-top:12px}
.card p{font-size:13.5px;color:#666;margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{margin-top:auto;padding-top:16px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:#777}
.card .foot .dot{width:7px;height:7px;border-radius:50%;flex:none}
.card .foot .org{color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .foot .team{font-weight:700;color:var(--ink)}
.card .foot .org{font-size:12px;font-weight:600}
.empty{padding:80px 0;text-align:center;color:var(--muted);font-size:14px}

/* detail page */
.detail{max-width:960px;margin:0 auto;padding:0 32px}
.back{display:inline-block;margin-top:40px;font-size:13.5px;font-weight:600;color:var(--muted)}
.back:hover{color:var(--ink)}
.tags{display:flex;gap:8px;align-items:center;margin-top:22px}
.tag{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--soft)}
.tag.dot{display:inline-flex;align-items:center;gap:6px;background:none;padding-left:0}
.tag.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--kc,var(--accent))}
h1.title{font-family:var(--font-display);font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.25;margin-top:14px}
.summary{margin-top:12px;font-size:18px;color:#444;white-space:pre-line}
.info{margin-top:32px;background:var(--soft);border-radius:18px;padding:8px 28px}
.info .row{display:grid;grid-template-columns:140px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid #e6e6e2;font-size:15px}
.info .row:last-child{border-bottom:0}
.info .row dt{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);padding-top:3px}
.sec{margin-top:64px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.sec-h h2{font-size:14px;font-weight:700;letter-spacing:.01em}
.sec-h .sub{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:400;letter-spacing:0}
.open-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border:1px solid var(--hair);border-radius:999px;padding:7px 14px;white-space:nowrap}
.open-btn:hover{border-color:#bbb}
.pdf{overflow:hidden;border-radius:18px;background:var(--soft);height:min(82vh,960px);border:1px solid var(--hair)}
.pdf iframe{width:100%;height:100%;border:0;display:block}
.pdf-missing{display:flex;align-items:center;justify-content:center;height:220px;color:var(--muted);font-size:14px}
.links{border:1px solid var(--hair);border-radius:18px;overflow:hidden}
.link{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:16px;padding:18px 24px;border-bottom:1px solid var(--hair);font-size:14px}
.link:last-child{border-bottom:0}
.link:hover{background:#fafaf8}
.link .kind{font-size:12px;font-weight:700;color:#555}
.link .kind span{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--soft)}
.link .txt{min-width:0}
.link .lbl{font-weight:600}
.link .url{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link .arr{color:#aaa}
.no-links{padding:28px 24px;font-size:14px;color:var(--muted);background:var(--soft);border-radius:18px}

/* footer */
footer{margin-top:90px;background:var(--foot);color:#fff}
footer .top{padding:40px 0 24px}
footer .mid{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;padding-bottom:32px}
footer .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--foot-line);border-radius:999px;padding:10px 16px;font-size:13px;font-weight:600;color:var(--foot-txt)}
footer .pill:hover{color:#fff;border-color:#5a5a5a}
footer .pills{display:flex;flex-wrap:wrap;gap:10px}
footer .totop{border:0;border-radius:10px;background:#3a3a3a;color:#fff;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer}
footer .bot{display:flex;flex-wrap:wrap;gap:4px 24px;border-top:1px solid var(--foot-line);padding:18px 0 28px;font-size:12.5px;color:var(--foot-txt)}
footer .bot a:hover{color:#fff}

@media (max-width:1024px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .layout{grid-template-columns:minmax(0,1fr);gap:24px}
  .side{min-width:0}
  .side .side-scroll{position:static;max-height:none}
  .side ul{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
  .side li button{white-space:nowrap;background:var(--soft)}
  .side li.kw{margin-top:0}
  .side li.org{display:none}
}
@media (max-width:640px){
  .wrap,.detail{padding:0 16px}
  .hdr .wrap{height:64px}
  .hdr nav{gap:18px;font-size:12.5px}
  .hdr nav .hide-sm,.brand-ki{display:none}
  h1.page{font-size:30px}
  .lead{font-size:16px}
  h1.title{font-size:28px}
  .summary{font-size:16px}
  .grid{grid-template-columns:1fr}
  .toolbar{flex-direction:column-reverse;align-items:stretch}
  .search{min-width:0}
  .info{padding:4px 18px}
  .info .row{grid-template-columns:1fr;gap:4px}
  .link{grid-template-columns:1fr auto;padding:16px 18px}
  .link .kind{grid-column:1/-1}
  .pdf{height:70vh}
  }
</style>
</head>

const SEMESTER = "26-2학기";

const app = document.getElementById("app");
// 키워드 색상: 기후·사회적포용·마음건강·지역소멸은 26-1 사이트와 동일
const KEYWORDS = [
  ["기후/환경", "#8EE6C2"],
  ["사회적포용", "#C0C0FF"],
  ["마음건강/돌봄", "#FFB8FF"],
  ["지역소멸", "#FFE682"],
  ["교육/제도", "#FFC48C"],
  ["접근성", "#8FD3FF"],
];
const KCOLOR = Object.fromEntries(KEYWORDS);
const kc = k => KCOLOR[k] || "#d0d0d0";
const state = { school: "전체", kw: "전체", org: "전체", q: "" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const oneLine = s => String(s || "").replace(/\s+/g, " ").trim();

const countBy = key => PROJECTS.reduce((m, p) => (m.set(p[key], (m.get(p[key]) || 0) + 1), m), new Map());
const schools = [...countBy("school").keys()];
const orgs = [...countBy("org").entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ko"));

function filtered() {
  const q = state.q.trim().toLowerCase();
  return PROJECTS.filter(p =>
    (state.school === "전체" || p.school === state.school) &&
    (state.kw === "전체" || p.keyword === state.kw) &&
    (state.org === "전체" || p.org === state.org) &&
    (!q || [p.name, p.team, p.summary, p.org, p.school, p.leader, p.keyword, p.innovator].join(" ").toLowerCase().includes(q))
  );
}

function renderList() {
  document.title = `${SEMESTER} 중간 아카이브 — 테크포임팩트 캠퍼스`;
  app.innerHTML = `
  <div class="wrap">
    <p class="eyebrow">TECH FOR IMPACT · 2026 FALL</p>
    <h1 class="page">${SEMESTER} 돕는 기술 중간 아카이브</h1>
    <p class="lead"><b>${schools.length}</b>개 대학의 <b>${PROJECTS.length}</b>개 팀이 <b>${orgs.length}</b>개 사회혁신조직과 함께 만들고 있는 돕는 기술을 소개해요.</p>

    <div class="layout">
      <aside class="side"><div class="side-scroll">
        <h4>주제 키워드</h4>
        <ul id="orgs"></ul>
      </div></aside>
      <section>
        <div class="chips" id="schools"></div>
        <div class="toolbar">
          <span class="count" id="count"></span>
          <label class="search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="프로젝트·팀·조직·키워드 검색" value="${esc(state.q)}">
          </label>
        </div>
        <div class="grid" id="grid"></div>
      </section>
    </div>
  </div>`;

  document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; paint(); });
  paint();
}

function paint() {
  const sBox = document.getElementById("schools");
  sBox.innerHTML = ["전체", ...schools].map(s =>
    `<button class="chip ${state.school === s ? "on" : ""}" data-s="${esc(s)}">${esc(s)}</button>`).join("");
  sBox.querySelectorAll("button").forEach(b => b.onclick = () => { state.school = b.dataset.s; paint(); });

  // 키워드 > 조직 트리. 선택한 학교 기준으로 개수를 다시 세고, 0개인 항목은 숨긴다
  const inSchool = PROJECTS.filter(p => state.school === "전체" || p.school === state.school);
  const tree = KEYWORDS.map(([k]) => {
    const ps = inSchool.filter(p => p.keyword === k);
    const os = [...new Set(ps.map(p => p.org))]
      .map(o => [o, ps.filter(p => p.org === o).length])
      .sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0], "ko"));
    return [k, ps.length, os];
  }).filter(([, n]) => n);
  if (state.kw !== "전체" && !tree.some(([k]) => k === state.kw)) state.kw = state.org = "전체";
  if (state.org !== "전체" && !inSchool.some(p => p.org === state.org)) state.org = "전체";

  const isAll = state.kw === "전체" && state.org === "전체";
  const oBox = document.getElementById("orgs");
  oBox.innerHTML =
    `<li><button class="${isAll ? "on" : ""}" data-k="전체"><span>전체</span><span>${inSchool.length}</span></button></li>` +
    tree.map(([k, n, os]) => `
      <li class="kw"><button class="${state.kw === k && state.org === "전체" ? "on" : ""}" data-k="${esc(k)}">
        <span class="k"><i class="kdot" style="background:${kc(k)}"></i>${esc(k)}</span><span>${n}</span></button></li>
      ${os.map(([o, m]) => `<li class="org"><button class="${state.org === o ? "on" : ""}" data-k="${esc(k)}" data-o="${esc(o)}"><span>${esc(o)}</span><span>${m}</span></button></li>`).join("")}`).join("");
  oBox.querySelectorAll("button").forEach(b => b.onclick = () => {
    state.kw = b.dataset.k; state.org = b.dataset.o || "전체"; paint();
  });

  const list = filtered();
  document.getElementById("count").innerHTML = `총 <b>${list.length}</b>개 프로젝트`;
  document.getElementById("grid").innerHTML = list.length ? list.map(p => `
    <a class="card" href="#/projects/${p.id}">
      <span class="meta">${esc(p.school)} · ${esc(p.team)}</span>
      <h3>${esc(p.name)}</h3>
      <p>${esc(oneLine(p.summary))}</p>
      <span class="foot"><span class="dot" style="background:${kc(p.keyword)}"></span><span class="team">${esc(p.keyword)}</span><span class="org">${esc(p.org)}</span></span>
    </a>`).join("") : `<div class="empty" style="grid-column:1/-1">조건에 맞는 프로젝트가 없어요.</div>`;
}

function renderDetail(id) {
  const i = PROJECTS.findIndex(p => p.id === id);
  if (i < 0) return renderList();
  const p = PROJECTS[i];
  document.title = `${p.name} — 테크포임팩트 캠퍼스`;

  const rows = [
    ["소속 · 팀", `${p.school} · ${p.team}`],
    ["팀장", p.leader],
    ["팀원", p.members.join(" · ")],
    ["사회혁신가", [p.innovator, p.org].filter(Boolean).join(" · ")],
  ].filter(r => r[1]);

  const viewUrl = p.worksheet ? `https://drive.google.com/file/d/${p.worksheet}/view` : p.worksheetUrl;

  app.innerHTML = `
  <article class="detail">
    <a class="back" href="#/">← 목록으로</a>
    <div class="tags"><span class="tag">${SEMESTER}</span><span class="tag dot" style="--kc:${kc(p.keyword)}">${esc(p.keyword)}</span></div>
    <h1 class="title">${esc(p.name)}</h1>
    ${p.summary ? `<p class="summary">${esc(p.summary)}</p>` : ""}

    <dl class="info">
      ${rows.map(([k, v]) => `<div class="row"><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}
    </dl>

    <section class="sec">
      <div class="sec-h">
        <div><h2>SECTION 01. 문제정의 및 기획 워크시트</h2><p class="sub">중간 점검 시점에 제출한 워크시트예요.</p></div>
        ${viewUrl ? `<a class="open-btn" href="${esc(viewUrl)}" target="_blank" rel="noopener">새 창에서 보기 ↗</a>` : ""}
      </div>
      ${p.worksheet
        ? `<div class="pdf"><iframe src="https://drive.google.com/file/d/${p.worksheet}/preview" loading="lazy" allow="autoplay" title="${esc(p.name)} 워크시트"></iframe></div>`
        : `<div class="pdf pdf-missing">제출된 워크시트가 없어요.</div>`}
    </section>

    <section class="sec">
      <div class="sec-h"><div><h2>SECTION 02. 진행 자료 · 관련 링크</h2><p class="sub">팀이 함께 공유한 기획 문서, 디자인, 저장소 등이에요.</p></div></div>
      ${p.links.length ? `<div class="links">${p.links.map(l => `
        <a class="link" href="${esc(l.url)}" target="_blank" rel="noopener">
          <span class="kind"><span>${esc(l.kind)}</span></span>
          <span class="txt">${l.label ? `<div class="lbl">${esc(l.label)}</div>` : ""}<div class="url">${esc(l.url)}</div></span>
          <span class="arr">↗</span>
        </a>`).join("")}</div>`
        : `<div class="no-links">아직 공유된 진행 자료가 없어요.</div>`}
    </section>

  </article>`;
}

let lastListScroll = 0;
function route() {
  const m = location.hash.match(/^#\/projects\/(\d+)/);
  if (m) { renderDetail(Number(m[1])); scrollTo(0, 0); }
  else { renderList(); scrollTo(0, lastListScroll); }
}
addEventListener("hashchange", () => {
  if (!location.hash.startsWith("#/projects/") && document.querySelector(".detail") === null) return;
  route();
});
addEventListener("scroll", () => { if (document.getElementById("grid")) lastListScroll = scrollY; }, { passive: true });
route();
</script>
</body>
</html>
