<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>26-2학기 중간 아카이브 — 테크포임팩트 캠퍼스</title>
<link rel="icon" href="/campus_2026_spring/icon.jpg" type="image/jpeg">
<meta name="description" content="테크포임팩트 캠퍼스 2026 가을학기 중간 워크시트 아카이브">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@font-face{font-family:"KakaoBigSans";src:url("assets/fonts/KakaoBigSans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"KakaoBigSans";src:url("assets/fonts/KakaoBigSans-Bold.woff2") format("woff2");font-weight:600 700;font-display:swap}
@font-face{font-family:"KakaoBigSans";src:url("assets/fonts/KakaoBigSans-ExtraBold.woff2") format("woff2");font-weight:800;font-display:swap}
:root{
  --font-display:"KakaoBigSans","Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --ink:#191919; --muted:#8c8c8c; --soft:#f4f4f2; --hair:#ececec; --ground:#fff;
  --accent:#fae100; --point:#e470dc;
  --foot:#272727; --foot-line:#404040; --foot-txt:#9c9c9c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,"Noto Sans KR",sans-serif;color:var(--ink);background:var(--ground);line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app{flex:1 0 auto}
footer{flex-shrink:0}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}

/* header */
.hdr{position:sticky;top:0;z-index:50;border-bottom:1px solid #eee;background:rgba(255,255,255,.92);backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px)}
.hdr .wrap{height:80px;display:flex;align-items:center;justify-content:space-between;gap:24px;color:#1c1c1c}

/* list page */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:56px}
h1.page{font-family:var(--font-display);font-size:54px;font-weight:800;letter-spacing:-.03em;margin-top:14px;line-height:1.08}
.lead{margin-top:20px;font-size:18px;color:#555}
.lead b{color:var(--ink)}

.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px;margin-top:48px}
.side{font-family:var(--font-display)}
.side h4{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--muted);margin-bottom:10px}
.side ul{list-style:none}
.side li button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border:0;background:none;border-radius:10px;font-size:13.5px;color:#555;cursor:pointer;text-align:left}
.side li button span:last-child{color:var(--muted);font-size:12px;font-weight:600}
.side li button:hover{background:var(--soft)}
.side li button.on{background:var(--soft);color:var(--ink);font-weight:700}
.side li.kw{margin-top:10px}
.side li.kw button{font-weight:700;color:var(--ink);font-size:14.5px}
.side li.kw button .k{display:inline-flex;align-items:center;gap:8px}
.side li.org button{padding:6px 12px 6px 28px;font-size:13px;font-weight:400;color:#666}
.side li.org button span:last-child{font-size:11.5px;font-weight:400}
.kdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.side .side-scroll{position:sticky;top:100px;max-height:calc(100vh - 120px);overflow:auto;padding-right:4px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--soft);background:#fff;border-radius:999px;padding:8px 17px;font-size:13.5px;font-weight:600;cursor:pointer;color:#1c1c1c}
.chip:hover{border-color:#ecece8;background:var(--soft)}
.chip.on{background:#1c1c1c;border-color:#1c1c1c;color:#fff}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 14px}
.count{font-size:14px;color:var(--muted)}
.count b{color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:8px 14px;min-width:240px}
.search input{border:0;background:none;outline:none;font-size:13.5px;width:100%}
.search svg{flex:none;color:#999}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:9px;background:var(--soft);border-radius:18px;padding:22px 22px 20px;min-height:206px;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.08)}
.card .meta{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h3{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.3}
.card p{font-size:13.5px;line-height:1.55;color:#4a4a4a;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{margin-top:auto;padding-top:6px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:#777}
.card .foot .dot{width:9px;height:9px;border-radius:50%;flex:none}
.card .foot .org{color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .foot .team{font-weight:700;color:var(--ink)}
.card .foot .org{font-size:12px;font-weight:600}
.empty{padding:80px 0;text-align:center;color:var(--muted);font-size:14px}

/* detail page */
.detail{max-width:864px;margin:0 auto;padding:0 32px}
.back{display:inline-block;margin-top:40px;font-size:13.5px;font-weight:600;color:var(--muted)}
.back:hover{color:var(--ink)}
.tags{display:flex;gap:10px;align-items:center;margin-top:24px}
.tag{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:#555}
.tag.dot{display:inline-flex;align-items:center;gap:7px;background:none;padding-left:0;font-size:14px;color:var(--ink)}
.tag.dot::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--kc,var(--accent))}
h1.title{font-family:var(--font-display);font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.12;margin-top:14px}
.summary{margin-top:14px;font-size:18px;color:#444;white-space:pre-line}
.info{margin-top:32px;background:var(--soft);border-radius:16px;padding:0 28px}
.info .row{display:grid;grid-template-columns:110px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid rgba(0,0,0,.05);font-size:15px}
.info .row:last-child{border-bottom:0}
.info .row dt{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);padding-top:1px}
.sec{margin-top:64px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px}
.sec-h h2{font-size:14px;font-weight:700;letter-spacing:.01em}
.sec-h .sub{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:400;letter-spacing:0}
.tabs{display:flex;gap:8px;margin-top:56px;border-bottom:1px solid var(--hair)}
.tabs a{position:relative;padding:14px 18px 16px;font-family:var(--font-display);font-size:17px;font-weight:700;color:#9a9a9a;transition:color .2s}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink)}
.tabs a.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px;background:var(--ink)}
.tabpanel > .sec:first-child,.tabpanel > .ptags + .sec{margin-top:40px}
.ptags{display:flex;flex-wrap:wrap;gap:8px;margin-top:32px}
.ptags span{font-size:13px;font-weight:600;color:#555;background:var(--soft);border-radius:999px;padding:6px 12px}
.stories{display:flex;flex-direction:column;gap:40px}
.story h3{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.snum{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--accent);font-size:13px;font-weight:800;letter-spacing:-.02em;flex:none}
.story p{font-size:15.5px;line-height:1.85;color:#333;white-space:pre-line}
.info.tools .row{align-items:start}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;background:#fff;border:1px solid #e4e4e0;border-radius:999px;padding:5px 11px}
.tchip.plan{background:transparent;border-style:dashed;border-color:#c8c8c4;color:#666}
.tchip.plan em{font-style:normal;font-size:10.5px;font-weight:700;color:#999}
.ht{position:relative;border:1px solid var(--hair);border-radius:18px;padding:28px 32px 10px;background:#fff;overflow:hidden}
.ht::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--kc,var(--accent))}
.ht-lead{font-family:var(--font-display);font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.ht-row{display:grid;grid-template-columns:110px 1fr;gap:20px;padding:16px 0;border-top:1px solid var(--hair)}
.ht-row:first-child{border-top:0}
.ht-row dt{align-self:start;justify-self:start;font-size:12px;font-weight:700;color:#555;background:var(--soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
.ht-row dd{font-size:16px;line-height:1.6;color:var(--ink)}
.pdf{overflow:hidden;border-radius:18px;background:var(--soft);height:min(82vh,960px);border:1px solid var(--hair)}
.pdf iframe{width:100%;height:100%;border:0;display:block}
.pdf-missing{display:flex;align-items:center;justify-content:center;height:220px;color:var(--muted);font-size:14px}
.links{border:1px solid var(--hair);border-radius:18px;overflow:hidden}
.link{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:16px;padding:18px 24px;border-bottom:1px solid var(--hair);font-size:15px}
.link:last-child{border-bottom:0}
.link:hover{background:#fafaf8}
.link .kind{font-size:12px;font-weight:700;color:#555}
.link .kind span{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--soft)}
.link .txt{min-width:0}
.link .lbl{font-weight:600}
.link .url{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link .arr{color:#aaa}
.no-links{padding:28px 24px;font-size:14px;color:var(--muted);background:var(--soft);border-radius:18px}

/* footer */
footer{margin-top:70px;background:var(--foot);color:#fff}
footer .top{padding:40px 0 24px}
footer .mid{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;padding-bottom:32px}
footer .sns{display:flex;gap:10px}
footer .sns a{display:flex;width:36px;height:36px;align-items:center;justify-content:center;border-radius:50%;background:#3a3a3a;transition:background .2s}
footer .sns a:hover{background:#4a4a4a}
footer .pills{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
footer .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--foot-line);border-radius:999px;padding:10px 16px;font-size:13px;font-weight:600;color:var(--foot-txt);transition:color .2s,border-color .2s}
footer .pill small{font-size:11px;opacity:.7}
footer .pill:hover{color:#fff;border-color:#5a5a5a}
footer .totop{border:0;border-radius:10px;background:#3a3a3a;color:#fff;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer}
footer .totop:hover{background:#4a4a4a}
footer .bot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 24px;border-top:1px solid var(--foot-line);padding:18px 0 28px;font-size:12.5px;color:var(--foot-txt)}
footer .bot a:hover{color:#fff}

@media (max-width:1024px){
  .layout{grid-template-columns:minmax(0,1fr);gap:24px}
  .side{min-width:0}
  .side .side-scroll{position:static;max-height:none}
  .side ul{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
  .side li button{white-space:nowrap;background:var(--soft)}
  .side li.kw{margin-top:0}
  .side li.org{display:none}
}
@media (max-width:780px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:767px){
  .hdr .wrap{gap:16px}
  .hdr .wrap svg[aria-label="Tech for Impact Campus"]{height:16px!important}
  .brand-ki svg{height:15px!important}
  footer .mid,footer .bot{flex-direction:column;align-items:flex-start}
  footer .bot{gap:8px}
  h1.page{font-size:36px}
  h1.title{font-size:32px}
}
@media (max-width:540px){ .grid{grid-template-columns:1fr} }
@media (max-width:640px){
  .wrap,.detail{padding:0 16px}
  h1.page{font-size:32px}
  .lead{font-size:16px}
  h1.title{font-size:30px}
  .summary{font-size:16px}
  .toolbar{flex-direction:column-reverse;align-items:stretch}
  .search{min-width:0}
  .info{padding:4px 18px}
  .info .row{grid-template-columns:1fr;gap:4px}
  .ht{padding:22px 20px 6px 24px}
  .ht-row{grid-template-columns:1fr;gap:8px}
  .tabs a{flex:1;text-align:center;font-size:16px}
  .story h3{font-size:19px}
  .link{grid-template-columns:1fr auto;padding:16px 18px}
  .link .kind{grid-column:1/-1}
  .pdf{height:70vh}
  }
</style>
</head>

     "body": "Re:Born은 난민 신청인을 조력하는 변호사·법률 조력 단체 실무자를 위한 COI(국가정황정보) 리서치 지원 도구입니다.\n\n난민 신청인은 본국에서 박해받을 위험이 있다는 주장을 객관적 자료로 뒷받침해야 하고, 그 핵심 증거가 COI입니다. Re:Born은 난민신청서·면접조서 등 신청인 한 사람의 사건 정보를 종합해 쟁점(국적, 박해 사유, 시기, 지역 등)을 파악하고, 이에 맞는 COI를 주요 발행처 보고서에서 찾아 관련 문단을 추출합니다. 추출한 문단은 원문 그대로 발췌하고 번역해, 법원·출입국 제출 형식(원문 보고서 + 발췌번역문)에 바로 쓸 수 있도록 출처와 함께 정리합니다.\n\n핵심 원칙은 \"요약하지 않고 발췌한다\"입니다. 증거는 아무것도 덧붙이거나 줄이지 않은 1차 원자료여야 하므로, AI는 검색·발췌·번역까지만 맡고, 어떤 자료를 증거로 채택해 어떻게 주장할지는 변호사가 결정합니다. 이를 통해 사건 1건당 10시간 이상 드는 리서치 시간을 줄여, 한정된 조력 인력이 더 많은 신청인을 도울 수 있게 하는 것이 목표입니다."

     "title": "돕는 기술 소개",
     "body": "KU:NNECT는 원예테라피 프로그램에서 시작된 식물 돌봄과 자기이해의 경험이 프로그램 종료 후에도 일상에서 이어질 수 있도록 지원하는 서비스를 기획하고 있습니다. 실제 이용자는 원예테라피 프로그램 참여자이며, 목표 도입 대상은 원예테라피 운영기관·센터·사업체입니다.\n\n서비스의 출발점은 기존 화분에 설치하는 소형 디바이스입니다. 토양 수분, 온도, 조도 등 식물의 재배 환경을 측정하고, 이를 식물이 사용자에게 직접 말을 건네는 듯한 메시지로 전달하고자 합니다. 식물의 관리 상태를 안내하는 것뿐 아니라 가벼운 응원과 위로의 메시지를 통해 정서적인 상호작용 경험을 제공하고, 식물과 사람의 연결을 강화하는 것이 핵심입니다.\n\n디바이스와 연계되는 웹서비스 '초록책장'에서는 이러한 상호작용을 마음돌봄 경험으로 확장하고자 합니다. 이용자는 자신의 식물을 등록하고 식물의 메시지를 확인하며, 원할 경우 자신의 감정과 일상을 돌아볼 수 있습니다. 감정 알아차림과 경험 돌아보기, 자기 성찰로 이어지는 간단한 질문과 기록 기능을 통해 일상적인 마음돌봄을 지원하는 방식입니다.\n\n또한 식물과 함께한 시간과 이용자의 경험을 기록하고 회고할 수 있도록 구상하고 있습니다. 식물의 생애가 끝난 이후에도 함께한 기록을 보존하고, 이용자가 원한다면 추모관에 일부 기록을 공유하거나 새로운 식물과 함께 다음 경험을 시작할 수 있도록 하는 방향입니다.\n\n향후에는 운영기관을 위한 관리자 웹을 마련하여, 참여자가 동의한 식물 돌봄 관련 기록과 서비스 이용 현황 등을 사후관리 및 워크숍 개선에 참고할 수 있도록 확장할 계획입니다.\n\n궁극적으로 KU:NNECT는 실제 식물과의 관계를 매개로 일상적인 자기 성찰과 마음돌봄을 지원하고, 원예테라피에서 시작된 경험이 프로그램 이후에도 지속될 수 있도록 돕는 서비스를 지향합니다."

     "body": "프로젝트 초기에는 청년들의 정서적 소진과 마음돌봄의 일상화 문제에 주목하여 도심 녹지 산책 앱, 마음 상태 알아차림 지원, 취미 기록 앱, 메뉴바 새싹 앱 등 다양한 B2C 아이디어를 검토했습니다.\n\n그러나 논의 과정에서 서비스를 지속적으로 이용해야 할 이유가 충분한지, 어떤 활동을 마음돌봄으로 정의할 것인지, 기존 서비스와 어떠한 차별성을 가질 수 있는지 등의 질문이 남았습니다.\n\n이에 새로운 마음돌봄 활동을 제안하기보다, 이미 원예테라피를 경험했거나 관심이 있는 사람들이 기존의 돌봄 경험을 일상으로 이어갈 수 있도록 돕는 방향으로 대상을 구체화했습니다. 초기 프로토타입은 그린테라피 워크숍 참여자를 중심으로 구상하고 있으며, 이를 바탕으로 원예테라피 운영기관과 참여자를 연결하는 B2B2C 구조를 설정했습니다.\n\n솔루션 설계에서는 그린테라피가 강조한 '연결의 가치'에 주목했습니다. 이를 식물과 사람의 관계에 적용하여, 단순히 식물의 상태를 알려주는 센서가 아니라 식물이 사용자에게 직접 말을 거는 듯한 상호작용을 통해 일상적인 관심과 돌봄을 유도하는 디바이스를 구상했습니다.\n\n또한 화분 자체를 전자기기로 제작하는 대신 기존 화분에 설치하는 소형 디바이스를 우선 검토하여 제작 및 기관의 도입 부담을 줄일 수 있는 방향을 고려했습니다.\n\n이후 디바이스의 역할을 구체화하면서 두 가지 문제를 추가로 고민했습니다.\n\n첫째, 식물 돌봄의 지속이 곧 마음돌봄의 지속을 의미하지는 않는다는 점입니다. 이에 식물의 상태를 확인하고 돌보는 경험을 서비스 이용의 자연스러운 계기로 삼아, 이용자가 자신의 감정과 일상을 돌아볼 수 있도록 하는 디지털 서비스의 필요성을 도출했습니다.\n\n둘째, 식물의 생애가 끝난 이후에도 그동안의 경험을 이어갈 수 있는가에 관한 문제입니다. 식물이 죽으면 디바이스의 직접적인 관리 대상은 사라지지만, 식물과 함께했던 시간과 이용자의 경험까지 사라질 필요는 없다고 보았습니다.\n\n이에 식물의 생애를 시간적 배경으로 삼아 이용자의 경험을 함께 기록하고, 이후에도 이를 돌아볼 수 있는 회고와 아카이빙 기능을 구상했습니다.\n\n이러한 고민을 바탕으로 '식물에 대한 관심 → 식물과의 상호작용 → 자기 성찰 → 경험의 축적 → 회고와 지속'이라는 서비스 흐름을 설정하고, 이를 웹서비스 '초록책장'으로 구체화했습니다.\n\n초기 프로토타입에서는 식물의 상태를 확인하고 메시지를 받는 경험, 간단한 감정 기록과 자기 성찰, 축적된 기록의 회고와 보존을 중심으로 구현하고자 합니다. 특히 이용자에게 매일 기록을 요구하거나 모든 식물 관리 메시지를 마음돌봄 질문으로 연결하지 않고, 자발적인 참여를 존중하는 방향으로 설계하고 있습니다.\n\n또한 기록을 선택적으로 공유할 수 있는 추모관을 구상하되, 식물의 죽음을 실패로 표현하거나 다른 이용자와의 비교를 유도하는 방식은 지양하고자 합니다.\n\n현재 디바이스 중심의 식물–사람 연결 강화와 웹서비스를 통한 경험 확장 방향을 정리했으며, 초기 프로토타입에서는 실제 식물의 상태 확인에서 마음돌봄과 기록·회고로 이어지는 기본적인 서비스 구조를 구현하는 데 집중하고자 합니다. 회고와 아카이빙 및 추모관은 개발 우선순위에 따라 단계적으로 구현하고, 관리자 웹은 후속 개발 대상으로 구분하고 있습니다."

     "body": "\"엄마, 밥뭇나?\"\n\n밥뭇나는 부모님과 떨어져 지내는 4050 자녀가 부모님의 식사 패턴 변화를 통해 노쇠를 사전에 예방할 수 있도록 돕는 서비스입니다. 바쁜 일상 속에서도 부모님 걱정을 놓지 못하는 자녀들은 매일 전화로 \"밥 먹었어?\"라고 묻지만, 언제나 돌아오는 \"잘 먹었다\"는 대답 너머의 변화까지 알기는 어렵습니다. 그러다 보니 식사가 줄고 건강이 나빠지는 신호를 뒤늦게 발견하게 되고, 확인하지 못한 불안은 고스란히 자녀의 부담으로 남습니다.\n\n밥뭇나는 일상 속 작은 단서에서 부모님의 변화를 알아차립니다. 부모님 댁에 있는 기존 밥솥에 전력 측정 플러그를 연결해 밥솥의 사용 패턴을 관찰하고, 식사 주기에 평소와 다른 변화가 나타나면 자녀에게 안부 확인을 권유합니다. 단순 사용 기록으로 식사 여부와 섭취량을 단정하는 것이 아니라, AI가 일정 기간 개별 가구의 평소 사용 흐름을 학습해 식사 패턴이 눈에 띄게 줄거나 흐름이 달라지면 \"평소와 다른 변화가 있으니 한 번 안부를 여쭤보세요\"라는 알림을 보내는 방식입니다. 자녀는 매일 확인하지 않아도 주간 리포트로 식사 흐름을 살펴보고 평소보다 구체적으로 안부를 물을 수 있으며, 부모님은 새로운 앱을 설치하거나 버튼을 누를 필요 없이 평소처럼 일상을 영위할 수 있습니다. 카메라나 음성 같은 민감한 개인정보를 수집하지 않고, 밥솥 사용 기록만으로 안부를 건넬 계기를 전하는 데 집중합니다.\n\n부모님께 새로운 부담을 드리지 않고 자녀가 물어보지 않아도 알아차릴 수 있는 변화를 전하는 것, 자녀가 \"그때 조금만 더 신경 썼다면\" 하고 후회하지 않도록 방지턱이 되어 주는 것이 밥뭇나의 목표입니다.일상적인 안부에 구체적인 단서를 더하여, 늦은 발견을 이른 알아차림으로 바꾸고자 합니다."

     "body": "팀의 첫 번째 회의 날, 저희는 문제정의 없이 '시니어 일자리 창출'이라는 해결책을 먼저 정하고 그 필요성을 찾는 방식으로 접근했습니다. 그러나 카카오 멘토 특강을 통해 문제를 먼저 검증해야 한다는 사실을 깨닫고 마인드맵과 브레인스토밍을 활용해 1)디지털 구인·구직의 어려움 2)세대 간 소통 3)실수나 건강 문제로 타인에게 부담을 주는 데 대한 미안함 4)경험을 남기고 싶은 마음 5)신체적 한계로 인한 장시간 말하기·글쓰기의 어려움이라는 다섯 가지 가설을 새로 세웠습니다.\n\n이후 아립앤위립 필드트립과 31년 차 사회복지사 면담에서 공통적으로 '시니어를 하나로 일반화하지 말라'는 조언을 들으며 차츰 가지를 제거해 갔습니다. 세대 간 소통 가설은 현장에서 어르신들이 청년과의 소통을 반드시 원한다고 보기 어려웠고, 현장 관계자 역시 청년 쪽에서도 그 필요성을 크게 느끼지 못한다고 말해 제외했습니다. 노인정이나 정자에 모여 대화하는 모습을 청년과의 소통 욕구로 해석한 것 자체가 우리의 추측이었다는 점도 확인했습니다. 자서전 가설은 이야기를 남기고 싶은 마음은 있을 수 있지만, 이미 기업과 서비스가 여럿 존재해 우리가 새롭게 해결해야 할 사회 문제라고 보기 어려워 조건부로 제외했습니다. 디지털 전환·구직 가설은 관련 공공·민간 교육이 이미 많고, 무엇보다 카카오임팩트에서 체계화된 프로그램이 존재했기에 보류했습니다. 결국 현장에서 들은 \"아프니까 배우고 싶지도 않다\"는 어르신의 말을 바탕으로 3번과 5번의 공통점인 '건강'이라는 키워드에 집중하게 되었습니다.\n\n가족들이 다같이 모이는 추석 기간, 저희는 가장 중요한 전환을 맞았습니다. 어르신들은 불편을 \"다 그러고 산다\"며 문제로 여기지 않았고, 오히려 어르신의 건강을 본인보다 더 걱정하는 사람은 주변 가족이었습니다. 이에 따라 가설의 주어를 '시니어'에서 '시니어의 건강을 걱정하는 부양가족'으로 바꾸었고, 팀 내 의견이 갈렸던 마지막 두 가설은 증거, 실행 가능성, 임팩트, 관심사를 기준으로 한 디시전트리로 비교해 부양가족 가설을 최종 채택했습니다. 가족이 가장 자주 건네는 안부가 \"밥 먹었어?\"라는 점에 주목해, 문제를 단순히 '어르신의 건강을 걱정한다'가 아니라 '식사의 양과 질이 조금씩 달라져도 떨어져 사는 가족이 알아차리기 어렵다'로 재정의했습니다. 이후 다시 진행한 주부양자 인터뷰에서 \"확인할 방법이 전화밖에 없으니 매번 같은 걸 반복해요\"라는 말을 들으며, 문제는 가족의 무관심이 아니라 정보의 부족이라는 점에 확신을 갖게 되었습니다."

     "body": "핵심 기술에는 ‘대화형 AI’, ‘RAG 기반 답변 생성’, ‘답변을 바탕으로 적절한 멘토 선배 추천’ 세 가지가 있습니다.\n 첫 번째, 대화형 AI는 LLM을 활용하여 학생의 막연한 고민을 대화로 구체화합니다. 고민의 배경, 목표 등을 정리하여 선배에게 전달할 수 있는 질문 형태로 구조화하는 것을 돕기도 합니다. 더불어 진학, 취업, 창업, 포트폴리오 제작 등 고민 분야 및 핵심 키워드를 분석하여 이후 멘토 매칭의 입력값으로 활용합니다.\n RAG는 졸업생 인터뷰와 거꾸로캠퍼스 진로, 진학 매뉴얼 등의 데이터를 벡터화하여 저장하고, 학생의 질문과 관련된 경험을 검색한 뒤 해당 근거를 바탕으로 답변을 생성하게 해줍니다. 답변에는 활용된 인터뷰의 출처를 연결하여 원문, 앞뒤 맥락을 확인할 수 있게 합니다.\n 멘토 추천은 학생의 질문 내용과 졸업생의 진로 이력, 경험 태그 등 사이의 유사도를 바탕으로 적합한 선배를 추천하고, 추천 이유를 함께 제시합니다. 이후 선배와의 직접 연락을 통해 선배의 답변을 받고, 이를 DB로 다시 축적하여 반복되는 고민에 재활용되는 구조를 구상 중입니다.\n 구현 과정에서 예상되는 기술적 도전 과제로는 여섯 가지가 있습니다.\n 첫째, 데이터 확보와 품질 문제입니다. 처음에는 졸업생들의 인터뷰를 직접 확보하여 데이터로 활용할 예정이었습니다. 이를 위해 카카오 멘토님께 피드백을 구한 결과, 최소 100명의 데이터를 확보해야 최소한의 성능이 보장될 것이라는 조언을 받았습니다. 하지만 짧은 기간 내에 100명의 졸업생들을 찾는 것, 이들에게 모두 심층 인터뷰를 진행하는 것이 어려울 것이라는 판단이 들었습니다. 이에 대한 해결책을 강구해보고자 거꾸로캠퍼스의 진로진학 상담 코치님과 인터뷰를 진행한 결과, 학교 자체에서 진행해온 인터뷰가 존재한다는 사실을 확인했습니다. 또, 졸업생들의 커뮤니티인 ‘투게덥’ 내에도 다수의 인터뷰 자료가 존재한다는 것을 확인하였습니다. 이들을 활용할 수 있다면 많은 졸업생 분들과 인터뷰 따로 진행하지 않아도, 데이터로 활용할 수 있겠다는 생각이 들었습니다. 다만 학교측에서 보관 중인 인터뷰 원본, 진학 데이터 등은 학교의 협조와 공개 범위에 대한 협의를 필요로 합니다. 이에 인터뷰 원본, 학교의 진로 진학 매뉴얼, 진학 결과, 졸업생 진로 현황 등의 필요 자료 중 우선순위가 높은 자료부터 요청드릴 예정입니다. 또, 초기에는 데이터 양이 적어 답변 품질이 제한될 수 있다는 우려가 듭니다. 프로젝트(수업) 종료 이후에도 학교에서 진행하는 다양한 진로 행사, 인터뷰 등의 데이터를 학교 측에서 데이터베이스에 축적시킬 수 있도록 하여, 답변 품질의 점진적인 향상을 기대하는 방안을 생각 중입니다.\n 둘째, 개인정보와 민감한 정보 보호입니다. 인터뷰 원문과 학생 질문에는 개인정보가 포함될 수 있습니다. 참여에 동의한 졸업생만 멘토로 리스트업해두는 방식, 축적되는 질의응답에 대한 검수절차가 필요합니다. 이에 생활기록부, 개별 상담기록은 민감도가 높을 것으로 생각되어 MVP 범위에서 제외하였습니다.\n 셋째, 인터뷰 데이터에 적합한 RAG 설계입니다. 길고 구어체인 인터뷰를 어떤 단위로 나눌지에 대한 과제가 존재합니다. 초반에는 데이터가 많지 않을 것으로 예상되어, 6명의 팀원들이 각각 직접 장문 데이터를 정제하는 방안을 생각 중입니다.\n 넷째, 할루시네이션 방지와 출처 신뢰성 확보입니다. 데이터에 없는 내용을 AI가 지어내지 않도록 하고, 근거가 없을 때는 없다고 답하며 ‘멘토 추천’으로 안내할 수 있도록 주의할 예정입니다.\n 다섯째, 멘토 추천의 정확도와 설명 가능성입니다. 고민 내용과 졸업생 경험 사이의 유사성을 정확히 판단하고 그 이유를 학생이 이해할 수 있도록 제시해야 하며, 경험 태그가 없는 경우 인터뷰와 프로필을 바탕으로 생성한 뒤, 직접적인 연결 과정에서는 따로 검수를 거치는 방안을 고려하고 있습니다.\n 여섯째, 지속 가능한 데이터 축적 구조입니다. 향후 진행될 선배들의 강연이나 인터뷰, 질의응답 등을 데이터베이스로 축적해 활용하려면 졸업생의 참여 동기와 품질 관리가 필요합니다. 이는 학교와 협의가 필요할 것으로 생각됩니다."

     "title": "돕는 기술 소개",
     "body": "시니어드림은 노인일자리 수행기관 담당자의 반복적인 행정업무를 줄이고, 참여 시니어의 활동 및 안전관리를 지원하는 AI 기반 통합 업무 지원 서비스입니다.\n\n현재 시니어클럽 등 노인일자리 수행기관의 담당자는 참여자 모집부터 서류 검토, 면접, 선발점수 산정, 출결 및 안전관리까지 다양한 업무를 수행하고 있습니다. 저희는 이 과정에서 반복적으로 발생하는 정보 입력과 확인, 기록 관리 등의 업무를 AI와 자동화 기술로 보조하고자 합니다.\n\n서비스는 크게 두 단계로 구성됩니다.\n\n-첫 번째는 선발·심사 업무 지원입니다. 신청 서류의 주요 정보를 AI로 추출하고, 담당자가 확인한 정보를 바탕으로 선발기준표에 따른 점수를 자동 계산합니다. 면접 내용 역시 AI를 활용해 항목별로 정리함으로써 담당자가 평가와 최종 의사결정에 집중할 수 있도록 지원할 계획입니다.\n\n-두 번째는 배치 이후 운영·안전관리 지원입니다. 참여 시니어가 간단한 조작으로 출퇴근을 확인하거나 결근 및 도움을 요청할 수 있도록 하고, 담당자는 이를 관리 화면에서 확인할 수 있도록 설계했습니다. 향후 기상정보와 활동 유형을 연계한 안전 알림 기능도 도입할 계획입니다.\n\n시니어드림은 기존 노인일자리 행정시스템을 대체하거나 AI가 참여자의 선발 여부를 직접 판단하는 서비스가 아닙니다. AI는 정보 정리와 기록을 지원하고, 최종적인 평가와 판단은 사람이 수행하는 인간 중심의 업무 보조 서비스를 지향합니다."
    },
    {
     "title": "문제 정의",
     "body": "저희가 정의한 핵심 문제는 노인일자리 사업의 확대에 비해 수행기관의 반복적인 행정업무를 효율적으로 처리할 수 있는 현장 지원 체계가 부족하다는 점입니다.\n\n노인일자리 사업은 고령층의 경제적·사회적 활동을 지원하는 중요한 정책이지만, 사업 규모가 확대될수록 수행기관 담당자가 관리해야 할 참여자와 업무도 증가합니다. 담당자는 참여자의 모집과 선발, 서류 검토, 면접, 점수 산정, 출결 확인, 안전관리 등을 함께 수행하고 있어 상당한 행정적 부담을 겪고 있습니다.\n\n이러한 문제는 10월 8일 광주 시니어클럽 현장 인터뷰에서도 구체적으로 확인할 수 있었습니다. 현장에서는 다수의 신청자를 대상으로 대면 면접과 서류 대조, 선발기준표 채점 및 시스템 입력을 반복적으로 수행하고 있었습니다. 특히 세대구성이나 과거 참여 이력 등 예외적인 조건을 일일이 확인해야 한다는 점에서 단순한 점수 계산 이상의 업무 부담이 존재했습니다.\n\n또한 참여자 선발 이후에도 출결 확인, 결근자 대응, 안전 공지 전달 등 지속적인 관리 업무가 발생하고 있었습니다. 이러한 반복 업무에 많은 시간이 투입되면 담당자가 참여자와 직접 소통하거나 개별적인 문제에 대응하는 데 사용할 수 있는 시간도 제한될 수 있습니다.\n\n저희는 이 문제의 원인을 단순한 인력 부족뿐 아니라 서류 정보, 평가 기록, 출결 및 안전관리 정보가 하나의 효율적인 업무 흐름으로 연결되지 못하는 구조에서도 찾았습니다.\n\n따라서 시니어드림은 노인일자리 수행기관의 담당자를 주요 사용자로 설정하고, 반복적인 정보 처리와 행정 절차를 간소화하여 운영 부담을 줄이는 것을 핵심 해결 과제로 정의했습니다."

    {
     "title": "핵심 기술 구현 계획",
     "body": "본 프로젝트는 시니어클럽 담당자의 반복적인 행정업무를 줄이기 위해 AI 기반 참여자 선발 및 통합 행정관리 시스템을 구현하는 것을 목표로 합니다.\n\n1. 주요 기술 스택 및 구현 방식\n\n- 프론트엔드(React/Next.js): 담당자가 참여자 정보, 선발 현황, 출결 및 서류를 한 화면에서 관리할 수 있는 웹 기반 관리자 대시보드를 구현할 예정입니다.\n- 백엔드(Python/FastAPI): 참여자 데이터 관리, 선발 점수 계산, AI 분석 결과 처리 등 핵심 업무 로직을 구현할 계획입니다.\n- 데이터베이스(Supabase/PostgreSQL): 참여자 정보, 선발 기준, 평가 결과, 출결 기록 등을 체계적으로 저장하고 관리할 예정입니다.\n- AI 및 문서 처리(OpenAI API, OCR): 신청서 등 비정형 문서에서 필요한 정보를 추출하고 정형 데이터로 변환하여 수작업 입력 부담을 줄일 계획입니다.\n\n2. 핵심 기능 구현 과정\n\n우선 시니어클럽 현장 인터뷰를 통해 확인한 반복적인 점수 입력, 참여자 선발, 서류 관리 등의 업무를 중심으로 기능을 개발합니다.\n\n참여자 신청서의 정보를 AI로 추출하고, 기관별 선발 기준에 따라 점수를 자동 산출하는 기능을 우선 구현할 예정입니다. 선발 점수는 사전에 설정된 평가 기준과 계산 규칙에 따라 산출하며, 담당자가 결과와 근거를 확인하고 수정할 수 있도록 설계합니다.\n\n이후 참여자별 서류 관리, 출결 기록 및 현황 조회 기능을 통합하여 담당자의 업무 흐름을 하나의 시스템에서 처리할 수 있도록 구현하고자 합니다.\n\n3. 예상되는 기술적 도전 과제 및 해결 방안\n\n첫째, 기관별 신청서 양식과 선발 기준이 달라 AI의 정보 추출 정확도가 낮아질 수 있습니다. 이를 해결하기 위해 주요 입력 항목을 표준화하고, AI가 추출한 데이터를 담당자가 검증·수정하는 절차를 적용할 예정입니다.\n\n둘째, 선발 과정에서는 공정성과 결과의 설명 가능성이 중요합니다. 따라서 AI가 선발 여부를 임의로 결정하기보다는 명확한 평가 기준에 따라 점수를 계산하고, 최종 판단은 담당자가 수행하도록 설계합니다.\n\n셋째, 참여자의 개인정보를 취급하는 만큼 접근 권한 관리와 데이터 보호가 필요합니다. 개발 및 시연 단계에서는 가상 데이터를 우선 활용하고, 실제 적용 시에는 인증, 권한 분리 및 개인정보 보호 체계를 마련할 계획입니다.\n\n4. 향후 개발 계획\n\n\n10월까지 제작한 프로토타입을 기반으로 11월에는 참여자 정보 관리, 문서 데이터 추출 및 선발 점수 자동화 기능을 우선 개발하고, 12월에는 기능 통합과 테스트를 진행할 예정입니다.\n\n이를 통해 단순한 AI 기술 시연을 넘어, 실제 시니어클럽 담당자의 행정업무 부담을 줄일 수 있는 실용적인 MVP를 완성하는 것이 최종 목표입니다."

     "body": "Prism은 하나의 사건을 여러 관점으로 나눠 보고, 내 생각을 먼저 정리한 뒤, 다른 사람의 생각을 이해하도록 돕는 모바일 뉴스 · 대화 앱입니다. 빛 하나가 여러 색으로 나뉘는 프리즘처럼, 한 이슈를 여러 시선으로 보자는 뜻을 담았습니다.\n\nSNS와 뉴스 댓글창의 자극적인 여론과 사회적 낙인에 대한 두려움 때문에 목소리를 내지 못하고 침묵하는 청년층을 위한 서비스이며, 다음의 네 가지 가치로 기능을 구성했습니다.\n\n1. 넓게 보기 (이슈 브리핑): 한 사건에 대한 여러 언론사의 보도를 묶어 핵심 요약과 중립적인 맥락을 비교해 제공합니다.\n2. 깊이 생각하기 (내 생각 정리 / 안전 버퍼): 댓글을 보기 전에 3가지 질문 칩이나 비공개 메모로 자신의 생각을 먼저 정리하도록 돕습니다.\n3. 안전하게 나누기 (AI 톤 필터): 공격적인 표현을 완화하고, 댓글 작성 시 핵심 뜻은 유지하면서 다정한 문장 수정안을 1회 제안합니다.\n4. 서로 이해하기 (인터랙티브 의견 지도 & Bridge Point): 찬반 양극화 대신 이유별로 의견을 묶고, 서로 다른 입장 속에서도 공통으로 동의하는 지점(Bridge Point)을 시각화합니다."

     "body": "‘옥천 이음’의 핵심 기술은 LLM을 활용한 대화형 정보 수집, 제보 데이터 구조화, 유사 제보 통합 및 정리의 세 가지로 구분할 수 있습니다. AI가 직접 기사를 작성하기보다는 기자의 취재를 지원하는 역할에 집중하여 기자의 고유한 권한과 판단을 존중하고자 합니다.\n 첫 번째는 AI 기반 인터뷰어 기능입니다. 주민이 텍스트나 사진, 음성 등을 통해 제보를 시작하면 AI가 입력 내용을 분석하고 취재에 필요한 정보 중 누락된 부분을 파악하여 후속 질문을 생성하도록 구성할 계획입니다. 예를 들어 특정 지역의 시설물이 파손되었다는 제보가 들어오면 AI는 정확한 장소와 발생 시점, 피해 상황, 관련 사진이나 증거 등을 추가로 질문할 수 있습니다. 이를 통해 짧고 불완전한 제보에서도 구체적인 취재 정보를 확보하고자 합니다. 또한 제보 구조화 기술을 통해 축적된 정보를 활용하여 장기적으로 AI 인터뷰어의 질문 품질을 개선할 계획입니다.\n 두 번째는 제보 정보 구조화 기술입니다. AI가 수집한 내용을 원문 그대로 저장하는 데 그치지 않고 시간, 장소, 관련 인물, 주요 키워드 등을 기준으로 정보를 구조화하여 제보와 기사를 분류합니다. 이를 통해 기자가 제보의 핵심 내용을 더욱 쉽게 파악하고 필요한 정보를 효율적으로 확인할 수 있도록 지원하고자 합니다.\n 세 번째는 유사 제보 통합 및 정리 기술입니다. 구조화된 제보 데이터를 기반으로 서로 다른 시점에 접수된 제보 사이의 유사성을 파악하고, 동일한 사건이나 이슈에 관한 제보를 하나로 묶어 관리하는 것을 목표로 합니다.\n 실제 언론 환경에서는 제보자의 개인정보와 익명성을 보호하고 정보의 정확성을 확인하는 과정이 반드시 필요합니다. 따라서 AI는 취재 지원 도구로 활용하되 사실 확인과 공익성 판단, 최종 기사화 여부는 기자가 결정하는 구조를 유지하고자 합니다."

     "body": "‘잇다(IT:DA)’는 발달장애인이 일상생활에 필요한 활동을 가상공간과 실물 도구를 활용해 반복적으로 연습하고, 어려움이 발생했을 때 적절한 도움을 받아 스스로 수행할 수 있도록 지원하는 디지털 자립생활 훈련 플랫폼입니다.\n\n발달장애인은 설거지나 청소와 같은 일상 과업에서 여러 행동을 순서대로 연결하거나 실제 도구를 조작하는 데 어려움을 겪을 수 있습니다. 저희는 이러한 어려움을 해결하기 위해 가상공간의 시각, 음성 안내와 실물 도구를 활용한 동작 훈련을 결합한 서비스를 기획했습니다.\n\n초기 서비스는 설거지 과업 중 핵심적인 '세척'과 '헹굼' 과정에 집중합니다. 이용자는 깨지지 않는 그릇과 수세미에 센서를 부착한 실물 키트를 활용해 문지르기, 그릇 돌리기, 헹구기 등의 동작을 연습하고, 시스템은 인식된 움직임을 웹 화면에 실시간으로 반영하도록 설계할 예정입니다.\n\n수행 중 어려움이 생기면 '도와줘요' 버튼을 통해 현재 행동에 맞는 음성, 시각 안내를 받을 수 있으며, 반복적인 도움이 필요한 경우에는 교사용 웹 화면에 알림을 전달해 현장 교사의 지원으로 연결합니다.\n\n핵심 가치는 기술이 행동을 대신 수행하는 것이 아니라, 이용자가 직접 시도하고 필요한 도움을 활용해 다시 스스로 해낼 수 있도록 돕는 것입니다."

const SEMESTER = "26-2학기";

const app = document.getElementById("app");
// 키워드 색상: 2026-fall 사회혁신가 페이지와 동일
const KEYWORDS = [
  ["기후/환경", "#8ee6c2"],
  ["사회적포용", "#c0c0ff"],
  ["접근성", "#c0c0ff"],
  ["마음건강/돌봄", "#ffb8ff"],
  ["지역소멸", "#ffe682"],
  ["교육/제도", "#d4d4d4"],
];
const KCOLOR = Object.fromEntries(KEYWORDS);
const kc = k => KCOLOR[k] || "#d0d0d0";
const state = { school: "전체", kw: "전체", org: "전체", q: "" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const oneLine = s => String(s || "").replace(/\s+/g, " ").trim();

const countBy = key => PROJECTS.reduce((m, p) => (m.set(p[key], (m.get(p[key]) || 0) + 1), m), new Map());
const schools = [...countBy("school").keys()];
const orgs = [...countBy("org").entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ko"));

function filtered() {
  const q = state.q.trim().toLowerCase();
  return PROJECTS.filter(p =>
    (state.school === "전체" || p.school === state.school) &&
    (state.kw === "전체" || p.keyword === state.kw) &&
    (state.org === "전체" || p.org === state.org) &&
    (!q || [p.name, p.team, p.summary, p.org, p.school, p.leader, p.keyword, p.innovator, ...(p.checkin?.tags || [])].join(" ").toLowerCase().includes(q))
  );
}

function renderList() {
  document.title = `${SEMESTER} 중간 아카이브 — 테크포임팩트 캠퍼스`;
  app.innerHTML = `
  <div class="wrap">
    <p class="eyebrow">TECH FOR IMPACT · 2026 FALL</p>

    <div class="layout">

          <label class="search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

function paint() {
  const sBox = document.getElementById("schools");
  sBox.innerHTML = ["전체", ...schools].map(s =>
    `<button class="chip ${state.school === s ? "on" : ""}" data-s="${esc(s)}">${esc(s)}</button>`).join("");
  sBox.querySelectorAll("button").forEach(b => b.onclick = () => { state.school = b.dataset.s; paint(); });

  // 키워드 > 조직 트리. 선택한 학교 기준으로 개수를 다시 세고, 0개인 항목은 숨긴다
  const inSchool = PROJECTS.filter(p => state.school === "전체" || p.school === state.school);
  const tree = KEYWORDS.map(([k]) => {
    const ps = inSchool.filter(p => p.keyword === k);
    const os = [...new Set(ps.map(p => p.org))]
      .map(o => [o, ps.filter(p => p.org === o).length])
      .sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0], "ko"));
    return [k, ps.length, os];
  }).filter(([, n]) => n);
  if (state.kw !== "전체" && !tree.some(([k]) => k === state.kw)) state.kw = state.org = "전체";
  if (state.org !== "전체" && !inSchool.some(p => p.org === state.org)) state.org = "전체";

  const isAll = state.kw === "전체" && state.org === "전체";
  const oBox = document.getElementById("orgs");
  oBox.innerHTML =
    `<li><button class="${isAll ? "on" : ""}" data-k="전체"><span>전체</span><span>${inSchool.length}</span></button></li>` +
    tree.map(([k, n, os]) => `
      <li class="kw"><button class="${state.kw === k && state.org === "전체" ? "on" : ""}" data-k="${esc(k)}">
        <span class="k"><i class="kdot" style="background:${kc(k)}"></i>${esc(k)}</span><span>${n}</span></button></li>
      ${os.map(([o, m]) => `<li class="org"><button class="${state.org === o ? "on" : ""}" data-k="${esc(k)}" data-o="${esc(o)}"><span>${esc(o)}</span><span>${m}</span></button></li>`).join("")}`).join("");
  oBox.querySelectorAll("button").forEach(b => b.onclick = () => {
    state.kw = b.dataset.k; state.org = b.dataset.o || "전체"; paint();
  });

  const list = filtered();
  document.getElementById("count").innerHTML = `총 <b>${list.length}</b>개 프로젝트`;
  document.getElementById("grid").innerHTML = list.length ? list.map(p => `
    <a class="card" href="#/projects/${p.id}">
      <span class="meta">${esc(p.school)} · ${esc(p.team)}</span>
      <h3>${esc(p.name)}</h3>
      <p>${esc(oneLine(p.summary))}</p>
      <span class="foot"><span class="dot" style="background:${kc(p.keyword)}"></span><span class="team">${esc(p.keyword)}</span><span class="org">${esc(p.org)}</span></span>
    </a>`).join("") : `<div class="empty" style="grid-column:1/-1">조건에 맞는 프로젝트가 없습니다.</div>`;
}

const linkList = (links, empty) => links.length ? `<div class="links">${links.map(l => `
  <a class="link" href="${esc(l.url)}" target="_blank" rel="noopener">
    <span class="kind"><span>${esc(l.kind)}</span></span>
    <span class="txt">${l.label ? `<div class="lbl">${esc(l.label)}</div>` : ""}<div class="url">${esc(l.url)}</div></span>

const secHead = (n, title, sub) =>

        </div>`).join("")}</div>
    </section>` : ""}
    ${Object.keys(c.tools).length ? `
    <section class="sec">
      ${secHead(++n, "활용 도구 · 기술 스택", "점선으로 표시된 도구는 앞으로 활용할 예정이거나 검토 중인 도구입니다.")}
      <dl class="info tools">${Object.entries(c.tools).map(([k, t]) => `
        <div class="row"><dt>${TOOL_LABEL[k]}</dt><dd><div class="tchips">${chips(t)}</div></dd></div>`).join("")}
      </dl>
    </section>` : ""}
    ${c.links.length ? `
    <section class="sec">
      ${secHead(++n, "진행 자료 · 관련 링크", "팀이 함께 공유한 기획 문서, 디자인, 저장소 등입니다.")}
      ${linkList(c.links, "")}
    </section>` : ""}`;
}

function problemPanel(p) {
  const pr = p.problem;
  let n = 0;
  return `
    ${pr.helping ? `
    <section class="sec">
      ${secHead(++n, "돕는 기술 한 줄 소개")}
      <div class="ht" style="--kc:${kc(p.keyword)}">
        <p class="ht-lead">우리 팀은</p>
        <dl>
          ${["지역 · 대상", "문제", "기술 · 솔루션"].map((k, i) => `
          <div class="ht-row"><dt>${k}</dt><dd>${esc(pr.helping[i])}</dd></div>`).join("")}
        </dl>
      </div>
    </section>` : ""}
    <section class="sec">
      ${secHead(++n, "문제정의 및 기획 워크시트", "문제 정의 단계에서 제출한 워크시트입니다.")}
      ${pr.worksheet
        ? `<div class="pdf"><iframe src="https://drive.google.com/file/d/${pr.worksheet}/preview" loading="lazy" allow="autoplay" title="${esc(p.name)} 워크시트"></iframe></div>`
        : `<div class="pdf pdf-missing">제출된 워크시트가 없습니다.</div>`}
    </section>
    <section class="sec">
      ${secHead(++n, "진행 자료 · 관련 링크", "팀이 함께 공유한 기획 문서, 디자인, 저장소 등입니다.")}
      ${linkList(pr.links, "아직 공유된 진행 자료가 없습니다.")}
    </section>`;
}

function renderDetail(id, tab) {
  const p = PROJECTS.find(p => p.id === id);
  if (!p) return renderList();
  document.title = `${p.name} — 테크포임팩트 캠퍼스`;

  // 왼쪽: 중간 체크인 / 오른쪽: 문제 정의. 낸 단계만 탭으로 보인다.
  const tabs = [p.checkin && ["checkin", "중간 체크인"], p.problem && ["problem", "문제 정의"]].filter(Boolean);
  const active = tabs.some(t => t[0] === tab) ? tab : tabs[0][0];

  const rows = [
    ["소속 · 팀", `${p.school} · ${p.team}`],
    ["팀원", [p.leader, ...p.members].filter(Boolean).join(" · ")],
    ["사회혁신가", [p.innovator, p.org].filter(Boolean).join(" · ")],
    ["카카오멘토", p.mentors.join(" · ")],
  ].filter(r => r[1]);

  app.innerHTML = `
  <article class="detail">
    <a class="back" href="#/">← 목록으로</a>
    <div class="tags"><span class="tag">${SEMESTER}</span><span class="tag dot" style="--kc:${kc(p.keyword)}">${esc(p.keyword)}</span></div>
    <h1 class="title">${esc(p.name)}</h1>
    ${p.summary ? `<p class="summary">${esc(p.summary)}</p>` : ""}

    <dl class="info">
      ${rows.map(([k, v]) => `<div class="row"><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}
    </dl>

    <nav class="tabs" role="tablist">
      ${tabs.map(([k, label]) => `<a role="tab" aria-selected="${k === active}" class="${k === active ? "on" : ""}" href="#/projects/${p.id}/${k}">${label}</a>`).join("")}
    </nav>
    <div class="tabpanel">${active === "checkin" ? checkinPanel(p) : problemPanel(p)}</div>
  </article>`;
}

let lastListScroll = 0;
function route() {
  const m = location.hash.match(/^#\/projects\/(\d+)(?:\/(\w+))?/);
  if (m) {
    const same = document.querySelector(".detail")?.dataset.id === m[1];
    const y = scrollY;
    renderDetail(Number(m[1]), m[2]);
    document.querySelector(".detail")?.setAttribute("data-id", m[1]);
    scrollTo(0, same ? y : 0);   // 탭만 바꿀 때는 스크롤 위치 유지
  } else { renderList(); scrollTo(0, lastListScroll); }
}
addEventListener("hashchange", route);
addEventListener("scroll", () => { if (document.getElementById("grid")) lastListScroll = scrollY; }, { passive: true });
route();
</script>
</body>
</html>
